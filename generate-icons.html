<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <h1>Icon Generator</h1>
  <p>Right-click each canvas and "Save image as..." to the icons folder</p>

  <h3>16x16</h3>
  <canvas id="icon16" width="16" height="16"></canvas>

  <h3>48x48</h3>
  <canvas id="icon48" width="48" height="48"></canvas>

  <h3>128x128</h3>
  <canvas id="icon128" width="128" height="128"></canvas>

  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      // Rounded rectangle background
      const radius = size * 0.15;
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.fill();

      // Download arrow
      ctx.strokeStyle = 'white';
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const arrowWidth = size * 0.5;
      const arrowHeight = size * 0.35;
      const centerX = size / 2;
      const arrowTop = size * 0.2;
      const arrowBottom = arrowTop + arrowHeight;

      ctx.lineWidth = size * 0.12;
      ctx.beginPath();
      ctx.moveTo(centerX, arrowTop);
      ctx.lineTo(centerX, arrowBottom);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(centerX - arrowWidth / 2, arrowBottom - arrowHeight * 0.4);
      ctx.lineTo(centerX, arrowBottom);
      ctx.lineTo(centerX + arrowWidth / 2, arrowBottom - arrowHeight * 0.4);
      ctx.stroke();

      // Bottom bar
      ctx.fillStyle = 'white';
      const barHeight = size * 0.1;
      const barWidth = size * 0.5;
      const barY = size * 0.7;
      ctx.beginPath();
      ctx.roundRect(centerX - barWidth / 2, barY, barWidth, barHeight, barHeight / 2);
      ctx.fill();
    }

    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
  </script>
</body>
</html>
